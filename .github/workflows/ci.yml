name: CI

# Build + unit tests on every push to main and every PR.
# Integration tests in IntegrationTests.swift auto-skip when no FLUX model
# is on disk, so they run as no-ops on CI — there's no realistic way to
# pull a 24 GB model archive into a hosted runner per build.
#
# Public repo → macOS runners are free (1× multiplier), so we run on every
# push and PR without path filtering beyond docs-only changes.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + Unit Tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-fluxkit-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-fluxkit-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build -v

      - name: Run unit tests
        # Use xcodebuild rather than `swift test` so MLX's metallib resource
        # is bundled correctly into the test runner — `swift test` on hosted
        # runners fails with "Failed to load the default metallib" because
        # the resource lookup path differs from Xcode's. `-parallel-testing-
        # enabled NO` keeps Metal device init single-threaded; mlx-swift
        # crashes when multiple test workers try to load the metallib at
        # once.
        #
        # Integration tests gated on model availability — auto-skip with a
        # "[Test] SKIP" log line. Configuration + Generation unit tests run
        # unconditionally.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme FluxKit \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Build (release, smoke check)
        # Catches release-only optimizer crashes (rare but real with MLX).
        # Skip tests in release config — same code paths as debug.
        run: swift build -c release
